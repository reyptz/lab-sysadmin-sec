# Serveur socle en haute disponibilité (ETI) : plusieurs réplicas sans état
# partageant PostgreSQL. La réservation des opérations, le chaînage de
# l'audit et l'ordonnanceur (un seul réplica actif) sont coordonnés en base.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: socle
  labels: { app.kubernetes.io/name: socle }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: socle }
  template:
    metadata:
      labels: { app.kubernetes.io/name: socle }
    spec:
      serviceAccountName: socle
      # Le bail d'une opération (120 s) couvre l'arrêt gracieux : une opération
      # interrompue est marquée en échec par un autre réplica, jamais rejouée.
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels: { app.kubernetes.io/name: socle }
      initContainers:
        # Dépôt de travail (GitOps, Ansible, Terraform) cloné avec une clé de
        # déploiement ; socle fait ensuite `git pull` avant chaque changement.
        - name: clone
          image: ghcr.io/reyptz/lab-sysadmin-sec/socle:main
          command: [git, clone, --branch=main, "git@github.com:reyptz/lab-sysadmin-sec.git", /repo]
          env:
            - name: GIT_SSH_COMMAND
              value: ssh -i /etc/socle/git/id_ed25519 -o UserKnownHostsFile=/etc/socle/git/known_hosts -o StrictHostKeyChecking=yes
          volumeMounts:
            - { name: repo, mountPath: /repo }
            - { name: git-key, mountPath: /etc/socle/git, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      containers:
        - name: socle
          image: ghcr.io/reyptz/lab-sysadmin-sec/socle:main
          args: [serve]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: SOCLE_DATABASE_URL
              valueFrom: { secretKeyRef: { name: socle-database, key: url } }
            - name: SOCLE_PUBLIC_URL
              value: https://socle.lab.example
            - name: SOCLE_WORKERS
              value: "4"
            - name: SOCLE_OIDC_ISSUER
              value: https://login.microsoftonline.com/<tenant-id>/v2.0
            - name: SOCLE_OIDC_AUDIENCE
              value: api://socle
            - name: GIT_SSH_COMMAND
              value: ssh -i /etc/socle/git/id_ed25519 -o UserKnownHostsFile=/etc/socle/git/known_hosts -o StrictHostKeyChecking=yes
          envFrom:
            # Canaux de notification (SOCLE_SLACK_WEBHOOK, SOCLE_PAGERDUTY_KEY…),
            # idéalement synchronisés par External Secrets Operator.
            - secretRef: { name: socle-notifications, optional: true }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: repo, mountPath: /repo }
            - { name: home, mountPath: /var/lib/socle }
            - { name: tmp, mountPath: /tmp }
            - { name: git-key, mountPath: /etc/socle/git, readOnly: true }
      volumes:
        - { name: repo, emptyDir: {} }
        - { name: home, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - name: git-key
          secret: { secretName: socle-git, defaultMode: 0400 }
