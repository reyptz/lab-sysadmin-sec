[workspace]
resolver = "3"
members = ["crates/socle-core", "crates/socle"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
repository = "https://github.com/reyptz/lab-sysadmin-sec"

[workspace.dependencies]
socle-core = { path = "crates/socle-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
regex = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.4"
jsonwebtoken = "12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "sqlite", "postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "time", "fs", "io-util", "sync", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["set-header", "timeout", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
