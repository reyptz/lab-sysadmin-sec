# Stack de monitoring locale (lab).
# - Digests vérifiés auprès du registre le 25 octobre 2026.
# - Ports bindés sur 127.0.0.1 : la stack n'est pas exposée sur le réseau local.
services:
  node-exporter:
    image: prom/node-exporter@sha256:7296504d4ada44b7d7ab4431e27e9f9900d8488f8d55842f4b12ae2704e16dfe
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"

  prometheus:
    image: prom/prometheus@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
    # Linux : rend joignable le serveur socle lancé sur l'hôte (make socle-serve).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"

  # Transmet les alertes critiques à socle (incidents). Épingler le digest
  # comme pour les autres services (docker buildx imagetools inspect).
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets:/etc/alertmanager/secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # GF_ADMIN_PASSWORD doit être défini dans l'environnement ou un fichier .env
      # (non versionné). Grafana refuse une valeur vide si GF_SECURITY_ADMIN_PASSWORD
      # est requis par la politique locale.
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD doit etre defini}
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data:
