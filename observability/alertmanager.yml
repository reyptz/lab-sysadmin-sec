# Routage des alertes : les alertes critiques (et « page ») sont transmises à
# socle, qui ouvre un incident dédupliqué par empreinte, notifie l'astreinte
# (PagerDuty, Slack, Teams) et le résout quand l'alerte retombe.
#
# Le jeton est un jeton d'API socle d'une équipe disposant de la gestion des
# incidents (rôle operator), créé par :
#   socle token create --name alertmanager --subject alertmanager --team sre --ttl 90d
# et déposé dans ./secrets/socle-token (non versionné).
global:
  resolve_timeout: 5m

route:
  receiver: journal
  group_by: [alertname, env, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: socle
      matchers:
        - severity =~ "critical|page"
      continue: true

receivers:
  - name: journal
  - name: socle
    webhook_configs:
      - url: http://host.docker.internal:8080/api/v1/webhooks/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/socle-token
