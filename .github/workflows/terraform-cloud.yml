name: Terraform multi-cloud CI/CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement à planifier (état et variables dédiés)
        type: choice
        options: [dev, staging, prod]
        default: dev
  push:
    branches: [main, master]
    paths:
      - 'infrastructure/terraform/aws/**'
      - 'infrastructure/terraform/azure/**'
      - 'infrastructure/terraform/gcp/**'
      - 'infrastructure/terraform/ovh/**'
      - 'infrastructure/terraform/scaleway/**'
      - '.github/workflows/terraform-cloud.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'infrastructure/terraform/aws/**'
      - 'infrastructure/terraform/azure/**'
      - 'infrastructure/terraform/gcp/**'
      - 'infrastructure/terraform/ovh/**'
      - 'infrastructure/terraform/scaleway/**'
      - '.github/workflows/terraform-cloud.yml'

# Moindre privilège : le token ne sert qu'à lire le code.
permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true
  TF_CLI_ARGS: "-no-color"

jobs:
  lint:
    name: Format & validate (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [aws, azure, gcp, ovh, scaleway]
    defaults:
      run:
        working-directory: infrastructure/${{ matrix.stack }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform fmt
        run: terraform fmt -check -diff -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  security:
    name: Checkov (${{ matrix.stack }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: aws
            soft_fail: false
          # Nouvelles zones d'accueil : rapport non bloquant le temps de traiter
          # (corriger ou justifier dans leur .checkov.yaml) les premiers écarts,
          # puis passer soft_fail à false comme pour AWS.
          - stack: azure
            soft_fail: true
          - stack: gcp
            soft_fail: true
          - stack: ovh
            soft_fail: true
          - stack: scaleway
            soft_fail: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        # Version épinglée (jamais @master) ; exceptions justifiées dans le
        # .checkov.yaml de chaque stack.
        uses: bridgecrewio/checkov-action@v12.3126.0
        with:
          directory: infrastructure/${{ matrix.stack }}
          config_file: infrastructure/${{ matrix.stack }}/.checkov.yaml
          framework: terraform
          soft_fail: ${{ matrix.soft_fail }}
          output_format: cli

  plan:
    name: Plan AWS
    runs-on: ubuntu-latest
    needs: [lint, security]
    # Le code d'une PR ne reçoit jamais d'identifiants AWS.
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_allowed_ssh_cidr: ${{ vars.ALLOWED_SSH_CIDR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-west-3

      # Même commande que `socle infra plan aws-core -e <env>` : état distant
      # verrouillé (backend/<env>.hcl) et variables versionnées (env/<env>.tfvars).
      # L'application passe exclusivement par socle (plan approuvé, empreinte vérifiée).
      - name: Terraform init
        working-directory: infrastructure/terraform/aws
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: terraform init -input=false -backend-config="backend/${TARGET_ENV}.hcl"

      - name: Terraform plan
        working-directory: infrastructure/terraform/aws
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: terraform plan -input=false -lock-timeout=300s -var-file="env/${TARGET_ENV}.tfvars"
