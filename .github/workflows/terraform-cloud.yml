name: Terraform AWS CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'infrastructure/aws/**'
      - '.github/workflows/terraform-cloud.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'infrastructure/aws/**'
      - '.github/workflows/terraform-cloud.yml'

# Moindre privilège : le token ne sert qu'à lire le code.
permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true
  TF_CLI_ARGS: "-no-color"

jobs:
  lint:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform fmt
        working-directory: infrastructure/aws
        run: terraform fmt -check -diff

      - name: Terraform init
        working-directory: infrastructure/aws
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infrastructure/aws
        run: terraform validate

  security:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        # Version épinglée (jamais @master) + échec bloquant sur finding.
        uses: bridgecrewio/checkov-action@v12.3135.0
        with:
          directory: infrastructure/aws
          framework: terraform
          soft_fail: false
          output_format: cli

  plan:
    name: Plan AWS
    runs-on: ubuntu-latest
    needs: [lint, security]
    # Le code d'une PR ne reçoit jamais d'identifiants AWS.
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_allowed_ssh_cidr: ${{ vars.ALLOWED_SSH_CIDR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-west-3

      - name: Terraform init
        working-directory: infrastructure/aws
        run: terraform init

      - name: Terraform plan
        working-directory: infrastructure/aws
        run: terraform plan -var="environment=ci" -input=false
