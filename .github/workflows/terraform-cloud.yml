name: Terraform AWS CI/CD

on:
  push:
    branches: [main, master]
    paths:
      - 'infrastructure/aws/**'
      - '.github/workflows/terraform-cloud.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'infrastructure/aws/**'
      - '.github/workflows/terraform-cloud.yml'

env:
  TF_IN_AUTOMATION: true
  TF_CLI_ARGS: "-no-color"

jobs:
  lint:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform fmt
        working-directory: infrastructure/aws
        run: terraform fmt -check -diff

      - name: Terraform init
        working-directory: infrastructure/aws
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infrastructure/aws
        run: terraform validate

  security:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/aws
          framework: terraform
          soft_fail: true
          output_format: cli

  plan:
    name: Plan AWS
    runs-on: ubuntu-latest
    needs: [lint, security]
    if: github.event_name == 'pull_request'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform init
        working-directory: infrastructure/aws
        run: terraform init

      - name: Terraform plan
        working-directory: infrastructure/aws
        run: terraform plan -var="environment=ci" -var="allowed_ssh_cidr=10.0.0.0/8" -var="rhel_ami_id=ami-0123456789abcdef0" -input=false
