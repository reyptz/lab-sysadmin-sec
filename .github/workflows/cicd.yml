name: CI/CD — Build, Test & Security

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/erp/**'
      - '.github/workflows/cicd.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'apps/erp/**'
      - '.github/workflows/cicd.yml'

# Moindre privilège par défaut pour GITHUB_TOKEN ; les jobs qui en ont besoin
# (push image, commit GitOps, upload SARIF) déclarent leurs propres permissions.
permissions:
  contents: read

env:
  APP_DIR: apps/erp
  REGISTRY: ghcr.io
  # Doit correspondre à l'image référencée par les manifests GitOps
  # (gitops/apps/erp/base/kustomization.yaml).
  IMAGE_NAME: ${{ github.repository }}/erp-app

jobs:
  # -------------------------------------------------------------------------
  # Stage 1 : Qualité & Tests Unitaires
  # -------------------------------------------------------------------------
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm audit --omit=dev --audit-level=moderate

      - name: Lint
        working-directory: ${{ env.APP_DIR }}
        run: npm run lint

      - name: Unit tests
        working-directory: ${{ env.APP_DIR }}
        run: npm test

  # -------------------------------------------------------------------------
  # Stage 2 : Build de l'image Docker (sans push sur PR)
  # -------------------------------------------------------------------------
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.APP_DIR }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image to tar
        run: |
          docker buildx build --output type=docker,dest=/tmp/app.tar \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.APP_DIR }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: /tmp/app.tar
          retention-days: 1

  # -------------------------------------------------------------------------
  # Stage 3 : Scan de sécurité de l'image (Trivy)
  # -------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      # Requis pour l'upload du rapport SARIF Trivy vers l'onglet Security.
      security-events: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: app-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/app.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Rapport Trivy JSON (preuve transmise à socle)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'json'
          output: 'trivy-report.json'

      - name: Publier le rapport de vulnérabilités
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 30

      - name: Fail on high/critical CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          exit-code: '1'
          ignore-unfixed: false
          severity: 'CRITICAL,HIGH'

  # -------------------------------------------------------------------------
  # Stage 4 : Push, signature (cosign, sans clé) et SBOM attesté (main)
  # -------------------------------------------------------------------------
  push:
    name: Push, signature et SBOM
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      # Signature sans clé : identité OIDC du workflow (Sigstore).
      id-token: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: app-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/app.tar

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=main-,format=long
            type=raw,value=latest

      - name: Tag and push
        env:
          # Sortie multi-lignes (un tag par ligne) : passée par variable
          # d'environnement, jamais interpolée directement dans le script.
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "$SOURCE_TAG" "$tag"
            docker push "$tag"
          done <<< "$TAGS"

      - name: Digest immuable publié
        id: digest
        env:
          SOURCE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          ref=$(docker inspect --format='{{index .RepoDigests 0}}' "$SOURCE_TAG")
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"

      - name: SBOM CycloneDX
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
          format: 'cyclonedx'
          output: 'sbom.cdx.json'

      - uses: sigstore/cosign-installer@v3

      - name: Signer l'image et attester le SBOM
        env:
          REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"

  # -------------------------------------------------------------------------
  # Stage 5 : Release et déploiement dev via socle (portes DevSecOps, GitOps,
  # audit). Avec un serveur socle (vars.SOCLE_URL), la CI passe par l'API ;
  # sans serveur, socle s'exécute en mode local dans le runner.
  # La promotion vers staging/prod se fait par `socle promote` (approbations).
  # -------------------------------------------------------------------------
  deploy:
    name: Release et déploiement dev (socle)
    runs-on: ubuntu-latest
    needs: [push, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      # Commit GitOps de l'overlay dev (mode local uniquement).
      contents: write
    env:
      SOCLE_URL: ${{ vars.SOCLE_URL }}
      SOCLE_TOKEN: ${{ secrets.SOCLE_CI_TOKEN }}
      SOCLE_ACTOR: github:${{ github.actor }}
      DIGEST: ${{ needs.push.outputs.digest }}
      # (le contexte env n'est pas disponible à ce niveau : valeur explicite)
      REF: ghcr.io/${{ github.repository }}/erp-app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: socle

      - name: Construire la CLI socle
        run: cargo build --release --locked --manifest-path socle/Cargo.toml -p socle

      - name: Rapport de vulnérabilités
        uses: actions/download-artifact@v4
        with:
          name: trivy-report

      - uses: sigstore/cosign-installer@v3

      - name: Vérifier la signature (preuve réelle, pas déclarative)
        run: |
          cosign verify "${REF}@${DIGEST}"             --certificate-identity-regexp "^${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/"             --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      - name: Enregistrer la release et ses preuves
        run: |
          mode=$([ -n "$SOCLE_URL" ] || echo --local)
          socle/target/release/socle $mode release register             --service erp-app --version "main-${GITHUB_SHA::12}" --digest "$DIGEST" --git-sha "$GITHUB_SHA"             --tests-passed true --trivy-report trivy-report.json --signed             --sbom "oci://${REF}@${DIGEST}#cyclonedx"             --provenance "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Déployer en dev
        run: |
          mode=$([ -n "$SOCLE_URL" ] || echo --local)
          socle/target/release/socle $mode deploy erp-app -e dev --release "$DIGEST"             --reason "Livraison continue ${GITHUB_SHA::12}" --wait

      - name: Exporter le journal d'audit (mode local)
        if: always() && env.SOCLE_URL == ''
        run: socle/target/release/socle --local audit export --out socle-audit.jsonl

      - name: Conserver le journal d'audit
        if: always() && env.SOCLE_URL == ''
        uses: actions/upload-artifact@v4
        with:
          name: socle-audit
          path: socle-audit.jsonl
          retention-days: 90
