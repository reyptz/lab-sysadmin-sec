version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/erp
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /apps/erp
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /observability
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /apps/shinra/src-engine
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /apps/shinra/src-agent
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /socle
    schedule:
      interval: weekly
    groups:
      socle-rust:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /socle
    schedule:
      interval: weekly
