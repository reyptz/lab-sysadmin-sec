apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: erp-prod

resources:
  - ../../base

replicas:
  - name: erp-app
    count: 3

images:
  - name: erp-app
    newTag: prod-latest

patches:
  - target:
      kind: Deployment
      name: erp-app
    patch: |-
      - op: replace
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
