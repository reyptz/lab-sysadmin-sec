{{- if .Values.autoscaling.enabled }}
# autoscaling/v2 est l'API moderne pour l'HPA, supportant les métriques de ressources standard, personnalisées et externes.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  # Nommage dynamique basé sur la Release Helm.
  name: {{ .Release.Name }}-{{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  # Référence de la cible du scaling : notre Deployment.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-{{ .Chart.Name }}
  # Les limites de scaling de notre flotte de Pods.
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    # Définition de la métrique déclencheuse du scaling.
    {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          # On se base sur le pourcentage d'utilisation moyenne par rapport à la resource 'request' CPU définie dans le Deployment.
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
{{- end }}
