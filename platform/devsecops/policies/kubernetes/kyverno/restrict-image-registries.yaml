apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-registries
      match:
        resources:
          kinds:
            - Pod
      validate:
        message: "Only images from approved registries are allowed"
        pattern:
          spec:
            containers:
              # ghcr.io/reyptz : registre des images du projet (voir CI/CD et GitOps).
              - image: "ghcr.io/reyptz/* | docker.io/library/* | registry.access.redhat.com/*"
