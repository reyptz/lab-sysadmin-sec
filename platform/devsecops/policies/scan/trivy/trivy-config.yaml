# Configuration Trivy (trivy --config <ce fichier> image <ref>).
# format, output, severity et exit-code sont des clés de premier niveau.
format: sarif
output: trivy-results.sarif

severity:
  - CRITICAL
  - HIGH

exit-code: 1

scan:
  scanners:
    - vuln
    - misconfig
    - secret

vulnerability:
  ignore-unfixed: false
