apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{values.name}}
  description: ${{values.description}}
  annotations:
    github.com/project-slug: myorg/${{values.name}}
    backstage.io/techdocs-ref: dir:.
    grafana/dashboard: https://grafana.internal/d/${{values.name}}
  tags:
    - microservice
    - nodejs
    - kubernetes
spec:
  type: service
  lifecycle: production
  owner: ${{values.owner}}
  system: billing
  dependsOn:
    - resource:postgres-${{values.name}}
    - component:api-gateway
  providesApi:
    - ${{values.name}}-api
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: postgres-${{values.name}}
  description: Base PostgreSQL managée pour ${{values.name}}
spec:
  type: database
  owner: ${{values.owner}}
  system: billing
