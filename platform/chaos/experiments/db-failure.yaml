apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: api-invoices-db-blackhole
  namespace: chaos-testing
spec:
  action: loss
  mode: all
  duration: "2m"
  selector:
    namespaces:
      - billing
    labelSelectors:
      app: api-invoices
  target:
    selector:
      namespaces:
        - billing
      labelSelectors:
        app: postgres
    mode: all
  loss:
    loss: "100"
    correlation: "100"
