apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: api-invoices-db-latency
  namespace: chaos-testing
spec:
  action: delay
  mode: all
  duration: "10m"
  selector:
    namespaces:
      - billing
    labelSelectors:
      app: api-invoices
  target:
    selector:
      namespaces:
        - billing
      labelSelectors:
        app: postgres
    mode: all
  delay:
    latency: "200ms"
    correlation: "50"
    jitter: "50ms"
