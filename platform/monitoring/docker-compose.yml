# Stack de monitoring locale (lab).
# - Digests vérifiés auprès du registre le 25 octobre 2026.
# - Ports bindés sur 127.0.0.1 : la stack n'est pas exposée sur le réseau local.
services:
  node-exporter:
    image: prom/node-exporter@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"

  prometheus:
    image: prom/prometheus@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # GF_ADMIN_PASSWORD doit être défini dans l'environnement ou un fichier .env
      # (non versionné). Grafana refuse une valeur vide si GF_SECURITY_ADMIN_PASSWORD
      # est requis par la politique locale.
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD doit etre defini}
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data:
