# Autoscaling horizontal (repris du chart Helm supprimé, désormais unique
# source : Kustomize). Les bornes sont surchargées par environnement.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: erp-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: erp-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
