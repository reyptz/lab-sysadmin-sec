# Variante on-premise : même opérateur (External Secrets Operator), backend
# HashiCorp Vault au lieu d'AWS Secrets Manager. Les ExternalSecret restent
# identiques : seul le SecretStore change d'un environnement à l'autre.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: erp-vault-secrets
  namespace: erp-prod
spec:
  provider:
    vault:
      server: https://vault.lab.internal:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: erp-app
          serviceAccountRef:
            name: erp-app
