[defaults]
inventory = ./inventory/inventory.yml
remote_user = ton_user_linux
# Vérification des clés hôtes SSH (anti-MITM). Désactiver uniquement en lab
# éphémère via ANSIBLE_HOST_KEY_CHECKING=False, jamais de façon permanente.
host_key_checking = True
retry_files_enabled = False

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# Utiliser ProxyJump pour un bastion ; un hôte compromis ne doit pas pouvoir
# utiliser l'agent du poste d'administration pour signer des connexions.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ForwardAgent=no
pipelining = True
