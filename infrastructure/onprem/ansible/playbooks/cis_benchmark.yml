---
- name: CIS Benchmark Linux (Level 1) - Audit & Remediate
  hosts: rhel_servers
  become: yes
  tasks:
    - name: CIS 1.1.1.1 Ensure mounting of cramfs is disabled
      lineinfile:
        path: /etc/modprobe.d/CIS.conf
        regexp: '^install cramfs'
        line: 'install cramfs /bin/true'
        create: yes
        owner: root
        group: root
        mode: '0644'

    - name: CIS 1.4.1 Ensure filesystem permissions are governed by systemd tmpfiles
      file:
        path: /etc/tmpfiles.d
        state: directory
        mode: '0755'

    - name: CIS 5.2.1 Ensure permissions on /etc/ssh/sshd_config are 600
      file:
        path: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: '0600'

    # 100+ règles CIS automatisées...
    # Lynis est fourni par EPEL : le rapport n'est généré que s'il est installé.
    - name: Vérifier la présence de Lynis
      ansible.builtin.command: which lynis
      register: lynis_bin
      changed_when: false
      failed_when: false

    - name: Generate compliance report
      ansible.builtin.shell: lynis audit system --quiet --no-colors > /var/log/cis-lynis-report.txt
      args:
        creates: /var/log/cis-lynis-report.txt
      when: lynis_bin.rc == 0
