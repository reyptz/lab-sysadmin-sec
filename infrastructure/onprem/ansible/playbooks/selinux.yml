---
- name: SELinux Enforcing + Trivy scan
  hosts: rhel_servers
  become: yes
  vars:
    trivy_image: "registry.access.redhat.com/ubi9/httpd-24"
    trivy_report: /var/log/trivy-scan.sarif

  tasks:
    - name: Outils SELinux (semanage, sealert) pour le troubleshooting
      package:
        name:
          - policycoreutils-python-utils
          - setroubleshoot-server
        state: present

    - name: SELinux enforcing
      ansible.posix.selinux:
        policy: targeted
        state: enforcing

    - name: Afficher le mode SELinux courant
      ansible.builtin.command: getenforce
      register: selinux_mode
      changed_when: false

    - name: Mode SELinux
      debug:
        msg: "SELinux: {{ selinux_mode.stdout }}"

    # Trivy n'est pas fourni par les dépôts RHEL : le scan n'est lancé que si le
    # binaire est déjà installé sur l'hôte (dépôt Aqua Security ou binaire officiel).
    - name: Vérifier la présence de Trivy
      ansible.builtin.command: which trivy
      register: trivy_bin
      changed_when: false
      failed_when: false

    - name: Trivy — scan de l'image (échec sur HIGH/CRITICAL)
      ansible.builtin.command: >
        trivy image --scanners vuln --severity CRITICAL,HIGH
        --format sarif --output {{ trivy_report }}
        --exit-code 1 {{ trivy_image }}
      when: trivy_bin.rc == 0
      register: trivy_scan
      changed_when: false
      failed_when: trivy_scan.rc not in [0, 1]

    - name: Résultat du scan Trivy
      debug:
        msg: >-
          {{ 'Trivy non installé : scan ignoré' if trivy_bin.rc != 0
             else ('Vulnérabilités HIGH/CRITICAL détectées, voir ' ~ trivy_report if trivy_scan.rc == 1
             else 'Aucune vulnérabilité HIGH/CRITICAL') }}
