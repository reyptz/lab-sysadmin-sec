---
- name: Hardening Bastion SSH
  hosts: bastion
  become: yes
  tasks:
    - name: Configuration SSH securisee (drop-in prioritaire, validé avant reload)
      copy:
        dest: /etc/ssh/sshd_config.d/00-lab-hardening.conf
        owner: root
        group: root
        mode: '0600'
        validate: '/usr/sbin/sshd -t -f %s'
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitEmptyPasswords no
          AllowAgentForwarding no
          X11Forwarding no
          MaxAuthTries 3
          ClientAliveInterval 300
          ClientAliveCountMax 0
      notify: restart sshd

    - name: Installation Fail2Ban
      dnf:
        name: fail2ban
        state: present

  handlers:
    - name: restart sshd
      service:
        name: sshd
        state: restarted
