---
- name: Hardening Bastion SSH
  hosts: bastion
  become: yes
  tasks:
    - name: Configuration SSH securisee (drop-in prioritaire, validé avant reload)
      copy:
        dest: /etc/ssh/sshd_config.d/00-lab-hardening.conf
        owner: root
        group: root
        mode: '0600'
        validate: '/usr/sbin/sshd -t -f %s'
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitEmptyPasswords no
          AllowAgentForwarding no
          X11Forwarding no
          MaxAuthTries 3
          ClientAliveInterval 300
          ClientAliveCountMax 3
      notify: restart sshd

    # fail2ban provient d'EPEL (absent des dépôts RHEL).
    - name: Importer la cle GPG EPEL
      ansible.builtin.rpm_key:
        key: "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ ansible_distribution_major_version }}"
        state: present

    - name: Activer le depot EPEL
      dnf:
        name: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_distribution_major_version }}.noarch.rpm"
        state: present

    - name: Installation Fail2Ban
      dnf:
        name: fail2ban
        state: present

    - name: Demarrer et activer Fail2Ban
      service:
        name: fail2ban
        state: started
        enabled: yes

  handlers:
    - name: restart sshd
      service:
        name: sshd
        state: restarted
