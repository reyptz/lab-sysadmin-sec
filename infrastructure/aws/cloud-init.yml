#cloud-config
package_update: true
package_upgrade: true

packages:
  - fail2ban
  - firewalld
  - chrony
  - dnf-automatic
  - audit

# Pas de compte sudo NOPASSWD supplémentaire : l'administration passe par
# l'utilisateur par défaut de l'AMI (ec2-user, clé SSH) ou AWS SSM Session
# Manager. Injecter des clés supplémentaires ici si nécessaire :
# users:
#   - name: labadmin
#     sudo: ALL=(ALL) ALL
#     lock_passwd: true
#     ssh_authorized_keys: [<clé publique>]

disable_root: true
ssh_pwauth: false

write_files:
  - path: /etc/ssh/sshd_config.d/00-lab-hardening.conf
    owner: root:root
    permissions: '0600'
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitEmptyPasswords no
      AllowAgentForwarding no
      X11Forwarding no
      MaxAuthTries 3

runcmd:
  # RHCSA / hardening : desactive le root login et force l'authentification par cle
  - sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
  - sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
  - /usr/sbin/sshd -t && systemctl reload sshd
  # Firewall minimal avec firewalld
  - systemctl enable --now firewalld
  - firewall-cmd --add-service=ssh --permanent
  - firewall-cmd --reload
  # Fail2ban : protection brute force SSH
  - systemctl enable --now fail2ban
  # Time sync (NTP)
  - systemctl enable --now chronyd
  # Mises a jour automatiques de securite
  - systemctl enable --now dnf-automatic.timer
  # Audit de base
  - systemctl enable --now auditd
