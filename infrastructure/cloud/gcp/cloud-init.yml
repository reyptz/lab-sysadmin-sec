#cloud-config
package_update: true
package_upgrade: true

packages:
  - fail2ban
  - ufw
  - chrony
  - unattended-upgrades
  - auditd

users:
  - name: labadmin
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: true

ssh:
  permit_root_login: false
  password_authentication: false

runcmd:
  # Hardening SSH (RHCSA)
  - sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
  - sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
  - systemctl restart sshd
  # Firewall
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw --force enable
  # Services de securite et monitoring
  - systemctl enable fail2ban chrony unattended-upgrades auditd
  - systemctl start fail2ban chrony unattended-upgrades auditd
  # Ops Agent pour Cloud Monitoring / Logging (GCP)
  - curl -sSO https://dl.google.com/cloudagents/add-google-cloud-ops-agent-repo.sh
  - bash add-google-cloud-ops-agent-repo.sh --also-install
  - systemctl enable google-cloud-ops-agent
  - systemctl start google-cloud-ops-agent
