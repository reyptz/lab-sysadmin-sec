title: SSH Brute Force Detection
status: stable
id: 2e4c3e2e-7e3b-4c5d-9a8e-1b2c3d4e5f6a
logsource:
  product: linux
  service: auth
detection:
  selection:
    - keywords:
      - 'Failed password'
      - 'authentication failure'
  condition: selection | count() by src_ip > 5
timeframe: 5m
level: medium
falsepositives:
  - Password manager misconfiguration
  - Legitimate administrator with multiple keys
references:
  - https://attack.mitre.org/techniques/T1110/
tags:
  - attack.credential_access
  - attack.t1110
